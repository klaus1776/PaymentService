server:
  servlet:
    context-path: "/limits-app"
  port: 8181

spring:
  application:
    name: limits-core
  datasource:
    url: jdbc:postgresql://localhost:5432/JAVAPRO_DB
    password: 111
    username: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  output:
    ansi:
      enabled: ALWAYS
  jpa:
    show-sql: true
    properties:
      hibernate:
        #        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
    hibernate:
      ddl-auto: none

service:
  limits-client-products: "/limits-app/v1/api/products/"
  limits-value: 10000.00
